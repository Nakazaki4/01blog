<section class="composer">
  @if (currentImages().length) {
    <div class="composer-thumbnails">
      @for (image of currentImages(); track $index) {
        <div class="thumbnail">
          <img [src]="image.url" alt="Post image" />
          <button
            type="button"
            mat-icon-button
            class="thumbnail-remove"
            (click)="removeImage(image.url, image.occurrence)"
            [disabled]="submitting()"
            aria-label="Remove image">
            <mat-icon>close</mat-icon>
          </button>
        </div>
      }
    </div>
  }

  <textarea
    #editor
    class="composer-input"
    placeholder="Share something…"
    rows="5"
    [ngModel]="body()"
    (ngModelChange)="body.set($event)"
    [disabled]="submitting()"></textarea>

  <input
    #fileInput
    type="file"
    accept="image/jpeg,image/png,image/webp,image/gif"
    class="hidden-input"
    (change)="onFileSelected($event)" />

  <footer class="composer-footer">
    <div class="composer-actions">
      <button
        type="button"
        mat-button
        (click)="onPickImage()"
        [disabled]="uploading() || submitting() || imageLimitReached()">
        <mat-icon>image</mat-icon>
        Insert image
      </button>

      <span class="image-counter" [class.limit]="imageLimitReached()">
        {{ imageCount() }} / {{ maxImages }} images
      </span>

      @if (uploading()) {
        <span class="composer-uploading">
          <mat-spinner diameter="16" />
          Uploading image…
        </span>
      }
    </div>

    <div class="composer-submit">
      <span class="char-counter" [class.short]="tooShort()" [class.long]="tooLong()">
        {{ charCount() }} / {{ minChars }}–{{ maxChars }}
      </span>
      <button
        type="button"
        mat-raised-button
        color="primary"
        (click)="submit()"
        [disabled]="uploading() || submitting() || outOfRange()">
        @if (isEditMode()) {
          {{ submitting() ? 'Saving…' : 'Save changes' }}
        } @else {
          {{ submitting() ? 'Posting…' : 'Post' }}
        }
      </button>
    </div>
  </footer>

  @if (error(); as e) {
    <p class="composer-error">{{ e }}</p>
  }
</section>
