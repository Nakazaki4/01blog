<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p class="message">{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">{{ cancelLabel }}</button>
  <button
    mat-raised-button
    type="button"
    [color]="confirmColor"
    (click)="confirm()">
    {{ confirmLabel }}
  </button>
</mat-dialog-actions>
